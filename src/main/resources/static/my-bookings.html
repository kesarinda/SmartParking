
<!DOCTYPE html>

<body class="my-bookings-page">

    <!-- NAVBAR -->
    <header class="navbar">

        <a class="brand" href="index.html">
            <span class="logo">P</span>
            Smart Parking
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="parking-lots.html">Parking Lots</a>
            <a class="active" href="my-bookings.html">My Bookings</a>

        <section class="bookings-header">
